name: 'AuditGuard Security Audit'
description: 'Automated security auditor for JS/TS repos. Runs ESLint, Semgrep, and npm audit.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  scan-path:
    description: 'Path to scan (repo root or subdirectory for monorepos)'
    required: false
    default: '.'
  fail-on-level:
    description: 'Minimum severity to fail CI (never, low, moderate, high, critical)'
    required: false
    default: 'critical'
    type: choice
    options:
      - never
      - low
      - moderate
      - high
      - critical
  semgrep-rulesets:
    description: 'Comma-separated Semgrep rulesets'
    required: false
    default: 'p/default,p/security-audit,p/owasp-top-ten'
  eslint-config:
    description: 'Custom ESLint config path'
    required: false
    default: ''
  auto-pr:
    description: 'Create auto-fix PR on push to main/master'
    required: false
    default: 'true'
  dry-run:
    description: 'Skip PR creation and comment posting'
    required: false
    default: 'false'
  report-lang:
    description: 'Report language (en or es)'
    required: false
    default: 'en'
    type: choice
    options:
      - en
      - es

outputs:
  total-findings:
    description: 'Total number of findings'
    value: ${{ steps.scan.outputs.total-findings }}
  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.scan.outputs.critical-count }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install AuditGuard dependencies
      shell: bash
      run: |
        npm ci --production
      working-directory: ${{ github.action_path }}

    - name: Install Semgrep
      shell: bash
      run: |
        pip install semgrep==1.170.1
      env:
        SEMGREP_SEND_METRICS: 'off'

    - name: Run AuditGuard scan
      id: scan
      shell: bash
      env:
        AUDITGUARD_SCAN_PATH: ${{ inputs.scan-path }}
        AUDITGUARD_FAIL_ON_LEVEL: ${{ inputs.fail-on-level }}
        AUDITGUARD_SEMGREP_RULESETS: ${{ inputs.semgrep-rulesets }}
        AUDITGUARD_ESLINT_CONFIG: ${{ inputs.eslint-config }}
        AUDITGUARD_AUTO_PR: ${{ inputs.auto-pr }}
        AUDITGUARD_DRY_RUN: ${{ inputs.dry-run }}
        AUDITGUARD_REPORT_LANG: ${{ inputs.report-lang }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cd "${{ github.workspace }}"
        node "${{ github.action_path }}/dist/index.js"
